<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Vimen — Run your trade business from one place</title>
  <meta name="description" content="Vimen helps electricians, plumbers, builders and other tradespeople manage jobs, invoices, clients and bookings — all in one simple app. Free to start." />
  <link rel="canonical" href="https://yourdomain.com/" />

  <!-- Open Graph (Facebook, WhatsApp, LinkedIn previews) -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://yourdomain.com/" />
  <meta property="og:title"       content="Vimen — Run your trade business from one place" />
  <meta property="og:description" content="Bookings, jobs, invoices and clients — all in one tool built for tradespeople." />
  <meta property="og:image"       content="https://yourdomain.com/og-image.png" />
  <meta property="og:locale"      content="en_GB" />

  <!-- Twitter card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Vimen — Run your trade business from one place" />
  <meta name="twitter:description" content="Bookings, jobs, invoices and clients — all in one tool built for tradespeople." />
  <meta name="twitter:image"       content="https://yourdomain.com/og-image.png" />

  <!-- Structured data — makes Google show rich results -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Vimen",
    "url": "https://yourdomain.com",
    "description": "Business management app for tradespeople. Manage jobs, invoices, clients and bookings in one place.",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web, iOS, Android",
    "offers": [
      { "@type": "Offer", "name": "Free", "price": "0",  "priceCurrency": "GBP" },
      { "@type": "Offer", "name": "Pro",  "price": "29", "priceCurrency": "GBP" }
    ],
    "aggregateRating": { "@type": "AggregateRating", "ratingValue": "4.9", "reviewCount": "247" }
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Vimen",
    "url": "https://yourdomain.com",
    "logo": "https://yourdomain.com/logo.png",
    "contactPoint": { "@type": "ContactPoint", "contactType": "support", "email": "hello@yourdomain.com" }
  }
  </script>

  <meta name="theme-color" content="#E8500A" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
